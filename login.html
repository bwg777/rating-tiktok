<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - TikTok Rating Advisor</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}

body{
background:#0F1115;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
}

.card{
width:100%;
max-width:420px;
background:#181C22;
border:1px solid #262F3A;
border-radius:22px;
padding:30px;
}

h1{
color:#FF6B00;
margin-bottom:8px;
}

p{
color:#9CA8B6;
margin-bottom:22px;
font-size:14px;
}

input{
width:100%;
padding:14px;
margin-bottom:14px;
background:#242A33;
border:1px solid transparent;
border-radius:12px;
color:#fff;
}

input:focus{
outline:none;
border-color:#FF6B00;
}

button{
width:100%;
padding:14px;
background:#FF6B00;
border:none;
border-radius:12px;
color:#fff;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.wa-btn{
width:100%;
padding:14px;
margin-top:12px;
background:#25D366;
border:none;
border-radius:12px;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.wa-btn:hover{
opacity:.9;
}

#error{
margin-top:14px;
color:#ff6b6b;
font-size:14px;
}
</style>
</head>

<body>

<div class="card">

<h1>TikTok Rating Advisor</h1>

<p>Masuk menggunakan akun yang diberikan admin.</p>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<button
class="wa-btn"
onclick="window.open('https://wa.me/6287887788017?text=Halo%20Admin,%20saya%20ingin%20aktivasi%20akun%20TikTok%20Rating%20Advisor','_blank')">
💬 Chat WhatsApp Aktivasi
</button>

<div id="error"></div>

</div>

<script>
const API="https://rating-tiktok-advisor-api.bennywenngo.workers.dev";

async function login(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value.trim();

const deviceId=localStorage.getItem("deviceId") || crypto.randomUUID();

localStorage.setItem("deviceId",deviceId);

try{

const res=await fetch(API+"/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email,
password,
deviceId
})
});

const data=await res.json();

if(data.success){

localStorage.setItem("tra_token",data.token);

window.location.href="index.html";

}else{

document.getElementById("error").innerText=data.message || "Login gagal.";

}

}catch(err){

document.getElementById("error").innerText="Gagal terhubung ke server.";

}

}
</script>

</body>
</html>
