<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Rating Advisor Admin</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,Arial,sans-serif;
}

body{
  background:#050811;
  color:white;
  display:flex;
  justify-content:center;
  padding:40px 20px;
}

.container{
  width:100%;
  max-width:900px;
}

.card{
  background:#111722;
  border:1px solid #22324a;
  border-radius:20px;
  padding:28px;
  margin-bottom:24px;
}

h1{
  color:#ff6b00;
  margin-bottom:8px;
}

h2{
  margin-bottom:18px;
}

input{
  width:100%;
  padding:14px;
  margin:14px 0;
  border:none;
  border-radius:10px;
  background:#232d3d;
  color:white;
}

button{
  background:#ff6b00;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

.result{
  display:none;
  margin-top:18px;
  background:#0d131d;
  border:1px solid #243246;
  border-radius:12px;
  padding:18px;
  white-space:pre-line;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}

th,td{
  padding:12px;
  border-bottom:1px solid #273244;
  text-align:left;
}

th{
  color:#ffb36c;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>Admin Dashboard</h1>
<p>Generate akun customer TikTok Rating Advisor.</p>

<input id="email" placeholder="Email Customer">

<button onclick="createUser()">Generate Akun</button>

<div id="result" class="result"></div>
</div>

<div class="card">
<h2>Daftar Customer</h2>

<table>
<thead>
<tr>
<th>Email</th>
<th>License</th>
<th>Status</th>
<th>Device</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="userTable">
<tr><td colspan="5">Loading...</td></tr>
</tbody>

</table>
</div>

</div>

<script>
const API="https://rating-tiktok-advisor-api.bennywenngo.workers.dev";

async function createUser(){

  const email=document.getElementById("email").value.trim();

  if(!email){
    alert("Masukkan email.");
    return;
  }

  try{

    const res=await fetch(API+"/create-user",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({email})
    });

    const data=await res.json();

    const box=document.getElementById("result");
    box.style.display="block";

    if(data.success){

      box.innerHTML=`✅ AKUN BERHASIL DIBUAT

Email:
${data.email}

Password:
${data.password}

License:
${data.license}`;

      document.getElementById("email").value="";
      loadUsers();

    }else{

      box.innerHTML=`❌ ${data.error || "Gagal membuat akun."}`;

    }

  }catch(err){

    alert("Gagal terhubung ke API.");
    console.error(err);

  }

}

async function loadUsers(){

  const tbody=document.getElementById("userTable");

  tbody.innerHTML='<tr><td colspan="5">Loading...</td></tr>';

  try{

    const res=await fetch(API+"/users?t="+Date.now());
    const users=await res.json();

    if(!Array.isArray(users)){
      tbody.innerHTML='<tr><td colspan="5">Gagal mengambil data.</td></tr>';
      return;
    }

    tbody.innerHTML="";

    users.forEach(u=>{

      tbody.innerHTML+=`
      <tr>
        <td>${u.email}</td>
        <td>${u.license_key}</td>
        <td>${u.is_active ? "🟢 Aktif" : "🔴 Nonaktif"}</td>
        <td>${u.device_id ? "📱 Terikat" : "⚪ Belum Login"}</td>
        <td>
          ${
            u.device_id
            ? `<button onclick="resetDevice('${u.email}')">Reset</button>`
            : "-"
          }
        </td>
      </tr>`;

    });

  }catch(err){

    tbody.innerHTML='<tr><td colspan="5">Error koneksi.</td></tr>';
    console.error(err);

  }

}

async function resetDevice(email){

  if(!confirm("Reset device untuk "+email+"?")){
    return;
  }

  try{

    const res=await fetch(API+"/reset-device",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({email})
    });

    const data=await res.json();

    if(data.success){

      alert("✅ Device berhasil di-reset.");
      loadUsers();

    }else{

      alert(data.error || "Gagal reset device.");

    }

  }catch(err){

    alert("Error koneksi.");
    console.error(err);

  }

}

loadUsers();
</script>

</body>
</html>
